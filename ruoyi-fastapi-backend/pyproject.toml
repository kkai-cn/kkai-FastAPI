[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoyi-fastapi-backend-cli"
version = "2.0.0"
description = "RuoYi-FastAPI backend internal CLI entrypoint"
requires-python = ">=3.10"
dependencies = [
    "aiofiles==25.1.0",
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "async-lru==2.4.0",
    "asyncmy==0.2.16",
    "bcrypt==5.0.0",
    "fastapi[all]==0.143.3",
    "loguru==0.7.3",
    "nh3==0.3.7",
    "openpyxl==3.1.5",
    "packaging==26.3",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "pydantic-validation-decorator==0.1.5",
    "pyjwt[crypto]==2.15.1",
    "pymysql==1.2.3",
    "redis==8.1.0",
    "ruff==0.17.1",
    "sqlalchemy[asyncio]==2.0.55",
    "sqlglot[rs]==30.23.0",
    "textual==8.2.8",
    "tzdata==2026.5",
    "user-agents==2.2.0",
]

[project.scripts]
ruoyi = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "browser: requires a real browser and the frontend network test host",
    "native: requires a prebuilt native plugin artifact",
    "integration: requires explicitly enabled external database or cache services",
    "contract: validates public CLI arguments, output, or cold-process behavior",
]

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.setuptools.package-data]
"cli.runtime.plugin.scaffold" = ["assets/*.tmpl", "assets/native/*.tmpl", "assets/web/*.tmpl", "assets/python/*.tmpl"]
